<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Startup Hiring Intelligence Copilot</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
</head>
<body class="bg-gray-100 min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const App = () => {
            const [opportunities, setOpportunities] = useState([]);
            const [loading, setLoading] = useState(true);
            const [filterStatus, setFilterStatus] = useState("");
            const [filterSource, setFilterSource] = useState("");
            const [searchTerm, setSearchTerm] = useState("");

            const fetchOpportunities = async () => {
                setLoading(true);
                try {
                    let url = '/api/opportunities/';
                    const params = new URLSearchParams();
                    if (filterStatus) params.append('status', filterStatus);
                    if (filterSource) params.append('source_type', filterSource);
                    if (searchTerm) params.append('company_name', searchTerm);

                    if (params.toString()) {
                        url += '?' + params.toString();
                    }

                    const response = await axios.get(url);
                    setOpportunities(response.data);
                } catch (error) {
                    console.error("Error fetching opportunities:", error);
                }
                setLoading(false);
            };

            useEffect(() => {
                fetchOpportunities();
            }, [filterStatus, filterSource, searchTerm]);

            const updateStatus = async (id, newStatus) => {
                try {
                    await axios.patch(`/api/opportunities/${id}`, { status: newStatus });
                    fetchOpportunities();
                } catch (error) {
                    console.error("Error updating status:", error);
                }
            };

            const triggerScan = async (type) => {
                try {
                    await axios.post(`/api/opportunities/trigger-scan?scan_type=${type}`);
                    alert(`${type} scan triggered successfully!`);
                } catch (error) {
                    console.error("Error triggering scan:", error);
                }
            };

            return (
                <div className="container mx-auto px-4 py-8">
                    <header className="mb-8 flex justify-between items-center">
                        <h1 className="text-3xl font-bold text-gray-800">🚀 Startup Hiring Intelligence Copilot</h1>
                        <div className="space-x-2">
                            <button onClick={() => triggerScan('funding')} className="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">Scan Funding</button>
                            <button onClick={() => triggerScan('leadership')} className="bg-indigo-600 text-white px-4 py-2 rounded hover:bg-indigo-700">Scan Leadership</button>
                            <button onClick={() => triggerScan('jobs')} className="bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700">Scrape Jobs</button>
                        </div>
                    </header>

                    <div className="bg-white p-6 rounded-lg shadow-md mb-8 flex flex-wrap gap-4">
                        <input
                            type="text"
                            placeholder="Search company..."
                            className="border p-2 rounded w-64"
                            value={searchTerm}
                            onChange={(e) => setSearchTerm(e.target.value)}
                        />
                        <select
                            className="border p-2 rounded"
                            value={filterStatus}
                            onChange={(e) => setFilterStatus(e.target.value)}
                        >
                            <option value="">All Statuses</option>
                            <option value="new">New</option>
                            <option value="reviewing">Reviewing</option>
                            <option value="contacted">Contacted</option>
                            <option value="ignored">Ignored</option>
                        </select>
                        <select
                            className="border p-2 rounded"
                            value={filterSource}
                            onChange={(e) => setFilterSource(e.target.value)}
                        >
                            <option value="">All Sources</option>
                            <option value="funding">Funding</option>
                            <option value="leadership_change">Leadership Change</option>
                            <option value="startup_job_post">Job Post</option>
                        </select>
                        <button onClick={fetchOpportunities} className="bg-gray-200 px-4 py-2 rounded hover:bg-gray-300">Refresh</button>
                    </div>

                    {loading ? (
                        <div className="text-center py-10 text-xl text-gray-600">Loading opportunities...</div>
                    ) : (
                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                            {opportunities.map(opp => (
                                <div key={opp.id} className="bg-white rounded-lg shadow-lg overflow-hidden border-t-4 border-blue-500">
                                    <div className="p-6">
                                        <div className="flex justify-between items-start mb-4">
                                            <h2 className="text-xl font-bold text-gray-800">{opp.company_name}</h2>
                                            <span className={`text-xs font-semibold px-2 py-1 rounded uppercase ${
                                                opp.source_type === 'funding' ? 'bg-green-100 text-green-800' :
                                                opp.source_type === 'leadership_change' ? 'bg-indigo-100 text-indigo-800' :
                                                'bg-blue-100 text-blue-800'
                                            }`}>
                                                {opp.source_type.replace('_', ' ')}
                                            </span>
                                        </div>
                                        <p className="text-gray-600 mb-4 line-clamp-2">{opp.signal_summary}</p>

                                        <div className="mb-4">
                                            <div className="text-sm font-medium text-gray-500">Intent Score</div>
                                            <div className="w-full bg-gray-200 rounded-full h-2">
                                                <div
                                                    className="bg-blue-600 h-2 rounded-full"
                                                    style={{ width: `${opp.hiring_intent_score}%` }}
                                                ></div>
                                            </div>
                                        </div>

                                        {opp.decision_maker && (
                                            <div className="mb-4 p-3 bg-gray-50 rounded border">
                                                <div className="text-xs text-gray-500 font-bold mb-1 uppercase">Recommended Contact</div>
                                                <div className="font-semibold text-gray-800">{opp.decision_maker.full_name}</div>
                                                <div className="text-sm text-gray-600">{opp.decision_maker.title}</div>
                                                {opp.decision_maker.linkedin_url && (
                                                    <a
                                                        href={opp.decision_maker.linkedin_url}
                                                        target="_blank"
                                                        className="text-xs text-blue-600 hover:underline mt-1 block"
                                                    >
                                                        LinkedIn Profile
                                                    </a>
                                                )}
                                            </div>
                                        )}

                                        <div className="flex justify-between items-center mt-6 pt-4 border-t">
                                            <select
                                                className="text-sm border rounded p-1"
                                                value={opp.status}
                                                onChange={(e) => updateStatus(opp.id, e.target.value)}
                                            >
                                                <option value="new">New</option>
                                                <option value="reviewing">Reviewing</option>
                                                <option value="contacted">Contacted</option>
                                                <option value="ignored">Ignored</option>
                                            </select>
                                            <a
                                                href={opp.source_url}
                                                target="_blank"
                                                className="text-sm text-gray-500 hover:text-blue-600 flex items-center"
                                            >
                                                View Source ↗
                                            </a>
                                        </div>
                                    </div>
                                </div>
                            ))}
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
